[pytest]
testpaths = modules/accounting/tests modules/bi/tests modules/core/repositories/tests modules/core/tests modules/inventory/tests modules/migration/tests modules/portal/tests modules/purchasing/tests modules/sales/tests modules/warehouse/tests packages/ai/tests packages/billing/tests packages/cache/tests packages/database/tests packages/mcp/servers/tests packages/mcp/tests packages/rate_limit/tests packages/redis/tests packages/security/tests packages/ws/tests tests
asyncio_mode = auto
filterwarnings =
    ignore::starlette.exceptions.StarletteDeprecationWarning
    ignore::pytest.PytestCollectionWarning
markers =
    integration: Real integration tests against external services (e.g. PostgreSQL)
    real_db: Tests that run against real PostgreSQL database
    concurrency: Concurrency and high-load stress tests
